version: "3.9"

networks:
  sneakerdrop:
    driver: bridge

volumes:
  pg_data:
  mongo_data:

services:

  # ── Databases ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [sneakerdrop]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sneakerdrop_auth
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    restart: unless-stopped
    networks: [sneakerdrop]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [sneakerdrop]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Application Services ───────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    networks: [sneakerdrop]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sneakerdrop_auth
      JWT_SECRET: sneakerdrop-jwt-secret-change-in-prod
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build: ./product-service
    restart: unless-stopped
    networks: [sneakerdrop]
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: sneakerdrop_products
    depends_on:
      mongo:
        condition: service_healthy

  raffle-service:
    build: ./raffle-service
    restart: unless-stopped
    networks: [sneakerdrop]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: sneakerdrop-jwt-secret-change-in-prod
      JWT_ALGORITHM: HS256
    depends_on:
      redis:
        condition: service_healthy

  winner-worker:
    build: ./winner-worker
    restart: unless-stopped
    networks: [sneakerdrop]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sneakerdrop_auth
      WIN_PROBABILITY: "0.10"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ── Frontend (nginx + reverse proxy) ──────────────────────────────────────
  # Only port 3000 is exposed. nginx proxies /api/* internally.

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [sneakerdrop]
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - product-service
      - raffle-service

  # ── Load Tester (optional — run with: docker compose --profile loadtest up) ─
  # Access Locust dashboard at http://<EC2_IP>:8089

  load-tester:
    build: ./load-tester
    restart: "no"
    networks: [sneakerdrop]
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
    # Locust target = raffle-service (internal). Dashboard exposed to host.
    command: locust -f locustfile.py --host http://raffle-service:8003
    ports:
      - "8089:8089"
    depends_on:
      - auth-service
      - raffle-service
    profiles:
      - loadtest
